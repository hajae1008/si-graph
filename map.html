<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>정보 지도 · 99 박주연</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body class="mappage">
<div id="map"></div>
<div class="map-title" id="map-title"></div>
<nav class="pagenav map-nav" id="map-nav"></nav>
<div class="map-empty" id="map-empty" hidden></div>
<div class="peek" id="peek" hidden></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="data.js"></script>
<script>
/* 바탕 지도에는 글자가 없다. 점에 손을 올려야 그 자리에서 찍은 것이 뜬다. */
(function(){
  const L_ = window.L, D = window.LIFE;
  const M = D?.map || {};
  const places = M.places || [], tracks = M.tracks || [];

  document.getElementById("map-title").textContent = D?.mapTitle || "정보 지도";

  const nav = document.getElementById("map-nav");
  [["처음","index.html","dim"],
   ["인생 그래프 →","graph.html",""],
   ["지인 인터뷰 →","interview.html",""],
   ["역할극 공연 →","show.html",""]].forEach(([t,h,c])=>{
    const a = document.createElement("a");
    a.textContent = t; a.href = h; if(c) a.className = c;
    nav.appendChild(a);
  });

  if(!places.length && !tracks.length){
    const e = document.getElementById("map-empty");
    e.hidden = false; e.textContent = "아직 저장한 장소가 없습니다.";
    return;
  }

  // 이 바탕 지도는 서울에서 z13 까지만 있다. 그 위로 올라가면 빈 타일이 나온다.
  const map = L_.map("map", {zoomControl:false, scrollWheelZoom:true, maxZoom:13});
  L_.control.zoom({position:"bottomright"}).addTo(map);

  // 라벨 없는 옅은 회색 지도. 글자가 없어야 장소만 남는다.
  L_.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}", {
    attribution: "Esri, HERE, Garmin, &copy; OpenStreetMap", maxZoom: 13,
  }).addTo(map);

  const pts = [];

  const PIN = 30;              // 과녁. 점 자체는 11px 이지만 손이 닿는 넓이는 이만큼.
  const peek = document.getElementById("peek");
  let shown = null;

  let cycle = null;
  function stopCycle(){ if(cycle){ clearInterval(cycle); cycle = null; } }

  function fill(p){
    peek.innerHTML = "";
    peek.classList.remove("text");
    stopCycle();
    if(p.gallery && p.gallery.length){      // 사진 여러 장 — 머무는 동안 넘어간다
      const i = document.createElement("img");
      i.addEventListener("load", place);
      let n = 0;
      i.src = p.gallery[0];
      peek.appendChild(i);
      if(p.gallery.length > 1){
        cycle = setInterval(()=>{ n = (n+1) % p.gallery.length; i.src = p.gallery[n]; }, 2000);
      }
    }else if(p.video){
      const v = document.createElement("video");
      v.src = p.video; if(p.poster) v.poster = p.poster;
      v.muted = true; v.loop = true; v.playsInline = true; v.autoplay = true;
      v.preload = "none";                     // 올릴 때까지 받지 않는다
      // 크기를 알기 전에 자리를 잡으면 화면 밖으로 잘린다. 알게 되면 다시 잡는다.
      v.addEventListener("loadedmetadata", place);
      peek.appendChild(v);
      v.play().catch(()=>{});
    }else if(p.img){
      const i = document.createElement("img");
      i.addEventListener("load", place);
      i.src = p.img; peek.appendChild(i);
    }
  }

  /* 궤적에는 보여줄 장면이 없다. 대신 이름과 한 줄을 띄운다. */
  function fillText(t){
    peek.innerHTML = "";
    peek.classList.add("text");
    stopCycle();
    const h = document.createElement("b"); h.textContent = t.label || "";
    const p2 = document.createElement("p"); p2.textContent = t.note || "";
    peek.append(h, p2);
  }

  /* 많이 걸은 길. 선은 얇아서 손이 잘 닿지 않으므로,
     보이지 않는 굵은 선을 겹쳐 두고 그쪽으로 받는다. */
  tracks.forEach(t => {
    const line = t.pts || t;
    if(!line || line.length < 2) return;
    L_.polyline(line, {color:"#111", weight:2.4, opacity:.9, interactive:false}).addTo(map);
    const hit = L_.polyline(line, {color:"#111", weight:16, opacity:0}).addTo(map);
    line.forEach(p => pts.push(p));
    if(!t.label && !t.note) return;
    const show = () => { fillText(t); peek.hidden = false; at = null; place(); };
    const hide = () => { peek.hidden = true; peek.innerHTML = ""; stopCycle(); };
    hit.on("mouseover", show);
    hit.on("mousemove", e => { at = map.latLngToContainerPoint(e.latlng); place(); });
    hit.on("mouseout", hide);
    hit.on("click", e => { at = map.latLngToContainerPoint(e.latlng); show(); });
  });

  const markers = places.map(p => {
    const m = L_.marker([p.lat, p.lon], {
      icon: L_.divIcon({
        className: "pin" + (p.img||p.video||p.gallery ? "" : " bare"),
        html:"<i></i>", iconSize:[PIN,PIN], iconAnchor:[PIN/2,PIN/2]}),
      keyboard: true,
    }).addTo(map);
    m._place = p;
    pts.push([p.lat, p.lon]);

    const open = () => {
      if(shown === m) return;
      shown = m;
      markers.forEach(x => x.getElement()?.classList.toggle("on", x === m));
      if(!(p.img || p.video || p.gallery)) return;   // 보여줄 것이 없는 자리
      at = null; fill(p);
      peek.hidden = false;
      place();
    };
    const close = () => {
      if(shown !== m) return;
      shown = null;
      m.getElement()?.classList.remove("on");
      peek.hidden = true; peek.innerHTML = ""; stopCycle();
    };

    m.on("mouseover", open);
    m.on("mouseout", close);
    m.on("click", () => { shown === m ? close() : open(); });   // 손가락으로도
    m.on("keypress", open);
    return m;
  });

  /* 미리보기를 점 옆에 붙이되 화면 밖으로 나가지 않게 민다 */
  let at = null;                       // 선 위에서는 커서를 따라간다
  function place(){
    if(!shown && !at) return;
    const pt = at || map.latLngToContainerPoint(shown.getLatLng());
    const w = peek.offsetWidth, h = peek.offsetHeight, pad = 14;
    let x = pt.x + 18, y = pt.y - h/2;
    if(x + w + pad > innerWidth)  x = pt.x - 18 - w;
    if(x < pad) x = pad;
    y = Math.max(pad, Math.min(y, innerHeight - h - pad));
    peek.style.transform = `translate3d(${Math.round(x)}px,${Math.round(y)}px,0)`;
  }

  /* 같은 자리에 겹친 점은 좌표를 속이지 않고 화면에서만 펼친다.
     옮길 때는 점만이 아니라 손이 닿는 영역째 옮긴다. 안쪽만 옮기면
     보이는 자리와 눌리는 자리가 어긋나 아무리 올려도 반응하지 않는다.
     Leaflet 이 위치에 transform 을 쓰므로, 비켜 세우는 일은 margin 으로 한다. */
  function fan(){
    const seen = [];
    markers.forEach(m => {
      const pt = map.latLngToContainerPoint(m.getLatLng());
      const g = seen.find(s => s.pt.distanceTo(pt) < PIN * 1.4);
      if(g){ g.list.push(m); } else { seen.push({pt, list:[m]}); }
    });
    seen.forEach(g => {
      g.list.forEach((m, i) => {
        const el = m.getElement();
        if(!el) return;
        let dx = 0, dy = 0;
        const n = g.list.length;
        if(n > 1){
          // 과녁이 서로를 덮지 않을 만큼 벌린다. 점이 늘수록 원도 커져야 한다.
          const r = Math.max(16, (PIN * 1.25) / (2 * Math.sin(Math.PI / n)));
          const a = (Math.PI * 2 * i) / n - Math.PI/2;
          dx = Math.cos(a) * r; dy = Math.sin(a) * r;
        }
        el.style.marginLeft = (-PIN/2 + dx).toFixed(1) + "px";
        el.style.marginTop  = (-PIN/2 + dy).toFixed(1) + "px";
      });
    });
  }

  map.on("zoomend moveend", () => { fan(); place(); });
  map.fitBounds(L_.latLngBounds(pts), {padding:[80,80], maxZoom:13});
  requestAnimationFrame(fan);
})();
</script>
</body>
</html>

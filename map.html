<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>정보 지도 · 99 박주연</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body class="mappage">
<div id="map"></div>
<div class="map-title" id="map-title"></div>
<nav class="pagenav map-nav" id="map-nav"></nav>
<div class="map-empty" id="map-empty" hidden></div>
<div class="peek" id="peek" hidden></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="data.js"></script>
<script>
/* 바탕 지도에는 글자가 없다. 점에 손을 올려야 그 자리에서 찍은 것이 뜬다. */
(function(){
  const L_ = window.L, D = window.LIFE;
  const M = D?.map || {};
  const places = M.places || [], tracks = M.tracks || [];

  document.getElementById("map-title").textContent = D?.mapTitle || "정보 지도";

  const nav = document.getElementById("map-nav");
  [["처음","index.html","dim"],
   ["인생 그래프 →","graph.html",""],
   ["지인 인터뷰 →","interview.html",""],
   ["역할극 공연 →","show.html",""]].forEach(([t,h,c])=>{
    const a = document.createElement("a");
    a.textContent = t; a.href = h; if(c) a.className = c;
    nav.appendChild(a);
  });

  if(!places.length && !tracks.length){
    const e = document.getElementById("map-empty");
    e.hidden = false; e.textContent = "아직 저장한 장소가 없습니다.";
    return;
  }

  const map = L_.map("map", {zoomControl:false, scrollWheelZoom:true});
  L_.control.zoom({position:"bottomright"}).addTo(map);

  // 라벨 없는 옅은 회색 지도. 글자가 없어야 장소만 남는다.
  L_.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}", {
    attribution: "Esri, HERE, Garmin, &copy; OpenStreetMap", maxZoom: 16,
  }).addTo(map);

  const pts = [];
  tracks.forEach(t => {
    if(!t || t.length < 2) return;
    L_.polyline(t, {color:"#111", weight:1.6, opacity:.55}).addTo(map);
    t.forEach(p => pts.push(p));
  });

  const peek = document.getElementById("peek");
  let shown = null;

  function fill(p){
    peek.innerHTML = "";
    if(p.video){
      const v = document.createElement("video");
      v.src = p.video; if(p.poster) v.poster = p.poster;
      v.muted = true; v.loop = true; v.playsInline = true; v.autoplay = true;
      v.preload = "none";                     // 올릴 때까지 받지 않는다
      // 크기를 알기 전에 자리를 잡으면 화면 밖으로 잘린다. 알게 되면 다시 잡는다.
      v.addEventListener("loadedmetadata", place);
      peek.appendChild(v);
      v.play().catch(()=>{});
    }else if(p.img){
      const i = document.createElement("img");
      i.addEventListener("load", place);
      i.src = p.img; peek.appendChild(i);
    }
  }

  const markers = places.map(p => {
    const m = L_.marker([p.lat, p.lon], {
      icon: L_.divIcon({className:"pin", html:"<i></i>", iconSize:[22,22], iconAnchor:[11,11]}),
      keyboard: true,
    }).addTo(map);
    m._place = p;
    pts.push([p.lat, p.lon]);

    const open = () => {
      if(shown === m) return;
      shown = m;
      markers.forEach(x => x.getElement()?.classList.toggle("on", x === m));
      fill(p);
      peek.hidden = false;
      place();
    };
    const close = () => {
      if(shown !== m) return;
      shown = null;
      m.getElement()?.classList.remove("on");
      peek.hidden = true; peek.innerHTML = "";
    };

    m.on("mouseover", open);
    m.on("mouseout", close);
    m.on("click", () => { shown === m ? close() : open(); });   // 손가락으로도
    m.on("keypress", open);
    return m;
  });

  /* 미리보기를 점 옆에 붙이되 화면 밖으로 나가지 않게 민다 */
  function place(){
    if(!shown) return;
    const pt = map.latLngToContainerPoint(shown.getLatLng());
    const w = peek.offsetWidth, h = peek.offsetHeight, pad = 14;
    let x = pt.x + 18, y = pt.y - h/2;
    if(x + w + pad > innerWidth)  x = pt.x - 18 - w;
    if(x < pad) x = pad;
    y = Math.max(pad, Math.min(y, innerHeight - h - pad));
    peek.style.transform = `translate3d(${Math.round(x)}px,${Math.round(y)}px,0)`;
  }

  /* 같은 자리에 겹친 점은 좌표를 속이지 않고 화면에서만 펼친다 */
  function fan(){
    const seen = [];
    markers.forEach(m => {
      const pt = map.latLngToContainerPoint(m.getLatLng());
      const g = seen.find(s => s.pt.distanceTo(pt) < 26);
      if(g){ g.list.push(m); } else { seen.push({pt, list:[m]}); }
    });
    seen.forEach(g => {
      g.list.forEach((m, i) => {
        const el = m.getElement()?.firstElementChild;
        if(!el) return;
        if(g.list.length === 1){ el.style.transform = ""; return; }
        const a = (Math.PI * 2 * i) / g.list.length - Math.PI/2, r = 15;
        el.style.transform = `translate(${(Math.cos(a)*r).toFixed(1)}px,${(Math.sin(a)*r).toFixed(1)}px)`;
      });
    });
  }

  map.on("zoomend moveend", () => { fan(); place(); });
  map.fitBounds(L_.latLngBounds(pts), {padding:[80,80], maxZoom:14});
  requestAnimationFrame(fan);
})();
</script>
</body>
</html>

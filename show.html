<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>역할극 공연 · 99 박주연</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<article class="script" id="script"></article>
<script src="data.js"></script>
<script>
/* 대본 80줄을 통째로 펼치면 무엇이 중요한지 보이지 않는다.
   요약과 인용을 앞에 세우고, 대본은 눌렀을 때만 펼친다. */
(function(){
  const S = window.LIFE?.show;
  const root = document.getElementById("script");
  if(!S){ root.textContent = "대본이 없습니다."; return; }

  const el = (tag, cls, text) => {
    const n = document.createElement(tag);
    if(cls) n.className = cls;
    if(text != null) n.textContent = text;
    return n;
  };
  const nav = () => {
    const n = el("nav","pagenav");
    [["처음","index.html","dim"],
     ["인생 그래프 →","graph.html",""],
     ["지인 인터뷰 →","interview.html",""]].forEach(([t,h,c])=>{
      const a = el("a", c, t); a.href = h; n.appendChild(a);
    });
    return n;
  };

  root.appendChild(nav());

  // ── 머리말
  const head = el("header","script-head");
  head.appendChild(el("h1", null, S.title));
  if(S.logline) head.appendChild(el("p","logline", S.logline));
  const facts = el("dl","facts");
  [["출연", S.cast], ["길이", S.duration], ["소품", S.props]].forEach(([k,v])=>{
    if(!v) return;
    facts.appendChild(el("dt", null, k));
    facts.appendChild(el("dd", null, v));
  });
  head.appendChild(facts);
  root.appendChild(head);

  // ── 장면
  S.scenes.forEach((sc, i) => {
    const sec = el("section","sc");

    const h2 = el("h2");
    h2.appendChild(el("span","no", String(i+1).padStart(2,"0")));
    h2.appendChild(el("em", null, sc.title));
    sec.appendChild(h2);

    if(sc.summary) sec.appendChild(el("p","summary", sc.summary));
    if(sc.quote){
      const q = el("blockquote","quote");
      q.appendChild(el("p", null, sc.quote));
      sec.appendChild(q);
    }

    // 대본은 접어 둔다
    const body = el("div","lines");
    body.hidden = true;
    sc.lines.forEach(ln => {
      if(ln.d){
        body.appendChild(el("p","dir", "(" + ln.d + ")"));
      }else if(ln.w){
        const box = el("div","say" + (ln.w === S.lead ? " lead" : ""));
        box.appendChild(el("div","who", ln.w));
        box.appendChild(el("p", null, ln.t));
        body.appendChild(box);
      }else if(ln.c){
        const box = el("div","say cont");
        box.appendChild(el("p", null, ln.c));
        body.appendChild(box);
      }
    });

    const toggle = el("button","showbtn","대본 보기");
    toggle.setAttribute("aria-expanded","false");
    toggle.addEventListener("click", ()=>{
      const open = body.hidden;
      body.hidden = !open;
      toggle.textContent = open ? "대본 접기" : "대본 보기";
      toggle.setAttribute("aria-expanded", String(open));
      toggle.classList.toggle("on", open);
    });

    sec.appendChild(toggle);
    sec.appendChild(body);
    root.appendChild(sec);
  });

  root.appendChild(nav());
})();
</script>
</body>
</html>

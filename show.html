<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>역할극 공연 · 99 박주연</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<article class="script" id="script"></article>
<script src="data.js"></script>
<script>
/* 대본은 목록이 아니라 이어서 읽는 글이라, 스크롤 스택을 쓰지 않는다.
   지문·화자·대사 세 겹을 각각 다른 무게로 세운다. */
(function(){
  const S = window.LIFE?.show;
  const root = document.getElementById("script");
  if(!S){ root.textContent = "대본이 없습니다."; return; }

  const el = (tag, cls, text) => {
    const n = document.createElement(tag);
    if(cls) n.className = cls;
    if(text != null) n.textContent = text;
    return n;
  };
  const nav = () => {
    const n = el("nav","pagenav");
    [["처음","index.html","dim"],
     ["인생 그래프 →","graph.html",""],
     ["지인 인터뷰 →","interview.html",""]].forEach(([t,h,c])=>{
      const a = el("a", c, t); a.href = h; n.appendChild(a);
    });
    return n;
  };

  root.appendChild(nav());

  const head = el("header","script-head");
  head.appendChild(el("h1", null, S.title));
  const meta = el("div","meta");
  [S.cast, S.duration].filter(Boolean).forEach((t,i)=>{
    if(i) meta.appendChild(el("span","sep","/"));
    meta.appendChild(el("span", null, t));
  });
  head.appendChild(meta);
  if(S.props) head.appendChild(el("div","meta", "소품: " + S.props));
  root.appendChild(head);

  S.scenes.forEach((sc, i) => {
    const sec = el("section","sc");
    const h2  = el("h2");
    h2.appendChild(el("span", null, String(i+1).padStart(2,"0")));
    h2.appendChild(el("em", null, sc.title));
    sec.appendChild(h2);

    sc.lines.forEach(ln => {
      if(ln.d){                                   // 지문
        sec.appendChild(el("p","dir", "(" + ln.d + ")"));
      }else if(ln.w){                             // 새 화자의 대사
        const box = el("div","say" + (ln.w === S.lead ? " lead" : ""));
        box.appendChild(el("div","who", ln.w));
        box.appendChild(el("p", null, ln.t));
        sec.appendChild(box);
      }else if(ln.c){                             // 같은 사람이 이어서
        const box = el("div","say cont");
        box.appendChild(el("p", null, ln.c));
        sec.appendChild(box);
      }
    });
    root.appendChild(sec);
  });

  root.appendChild(nav());
})();
</script>
</body>
</html>
